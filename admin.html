<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>排行榜後台管理</title>
  <style>
    body {
      font-family: sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 0;
    }
    .container {
      max-width: 1000px;
      margin: 40px auto;
      padding: 20px;
      background: white;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    h1 {
      text-align: center;
      color: #333;
      margin-bottom: 24px;
    }
    .controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    .controls input[type="text"] {
      width: 200px;
      padding: 8px;
      font-size: 16px;
    }
    .controls button {
      padding: 10px 16px;
      font-size: 16px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    .controls button#search-btn {
      background: #3498db;
      color: white;
    }
    .controls button#clear-btn {
      background: #e74c3c;
      color: white;
    }
    .right-actions{
  display:flex;
  gap:12px;
  align-items:center;
}

/* 返回首頁按鈕 */
.controls button#back-btn{
  background:#2ecc71;
  color:white;
}

    table {
      width: 100%;
      border-collapse: collapse;
    }
    table th, table td {
      padding: 8px;
      border: 1px solid #ccc;
      text-align: center;
    }
    table th {
      background: #eee;
    }
    #message {
      margin-top: 12px;
      color: green;
    }
    .auth-panel {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 12px;
      margin-bottom: 16px;
      border: 1px solid #ddd;
      border-radius: 8px;
      background: #fafafa;
    }
    .auth-panel button {
      padding: 10px 16px;
      font-size: 16px;
      border: none;
      border-radius: 4px;
      background: #3498db;
      color: white;
      cursor: pointer;
    }
    .auth-panel button:disabled {
      opacity: 0.65;
      cursor: wait;
    }
    #admin-status {
      color: #555;
      line-height: 1.4;
    }
    .delete-one-btn {
  background: #f39c12;
  color: white;
  border: none;
  border-radius: 4px;
  padding: 6px 10px;
  cursor: pointer;
    }
    .delete-one-btn:hover {
  filter: brightness(0.95);
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>排行榜後台管理</h1>
    <div class="auth-panel">
      <div id="admin-status">請先使用老師 Google 帳號登入。</div>
      <button id="admin-google-btn">老師 Google 登入</button>
    </div>
    <div class="controls">
      <!-- 班級搜尋欄：輸入前 N 碼，點「搜尋」 -->
      <div>
        <input type="text" id="class-input" placeholder="輸入班級編號 (例如：301)" />
        <button id="search-btn">搜尋</button>
      </div>
      <!-- 右側按鈕群組 -->
<div class="right-actions">
  <button id="back-btn">返回遊戲</button>
  <button id="clear-btn">清除所有成績</button>
</div>

    </div>

    <!-- 資料表 -->
    <table>
      <thead>
        <tr>
          <th>排名</th>
          <th>玩家編號</th>
          <th>最高關卡</th>
          <th>最高分數</th>
          <th>圖鑑數量</th>
          <th>銅/銀/金</th>
          <th>總分</th>
          <th>最後更新</th>
          <th>操作</th>
        </tr>
      </thead>
      <tbody id="leaderboard-body">
        <!-- JavaScript 會動態插入 -->
      </tbody>
    </table>

    <div id="message"></div>
  </div>

  <script type="module">
    import {
      apiFetch,
      onFirebaseUserChanged,
      signInWithGoogle,
      syncGoogleSession
    } from './js/auth.js';

    const adminStatus = document.getElementById('admin-status');
    const adminGoogleBtn = document.getElementById('admin-google-btn');
    const messageEl = document.getElementById('message');

    window.LBData = [];

    function setMessage(text, isError = false) {
      messageEl.textContent = text;
      messageEl.style.color = isError ? '#e74c3c' : 'green';
    }

    function renderTable(entries) {
      const tbody = document.getElementById('leaderboard-body');
      tbody.innerHTML = '';

      const sorted = [...entries].sort((a, b) => b.totalScore - a.totalScore);
      if (sorted.length === 0) {
        tbody.innerHTML = '<tr><td colspan="9">目前沒有資料</td></tr>';
        return;
      }

      sorted.forEach((item, idx) => {
        const tr = document.createElement('tr');
        const updatedAt = item.updatedAt || item.lastPlayedAt || item.lastLoginAt;
        tr.innerHTML = `
          <td>${idx + 1}</td>
          <td>${item.playerId || ''}</td>
          <td>${item.highestLevel || 0}</td>
          <td>${item.highestScore || 0}</td>
          <td>${item.vocabCount || 0}</td>
          <td>${item.bronzeCount || 0}/${item.silverCount || 0}/${item.goldCount || 0}</td>
          <td>${item.totalScore || 0}</td>
          <td>${updatedAt ? new Date(updatedAt).toLocaleString() : ''}</td>
          <td>
            <button class="delete-one-btn" data-studentid="${item.studentId}" data-playerid="${item.playerId || ''}">
              刪除
            </button>
          </td>
        `;
        tbody.appendChild(tr);
      });

      document.querySelectorAll('.delete-one-btn').forEach(btn => {
        btn.addEventListener('click', async () => {
          const studentId = btn.dataset.studentid;
          const playerId = btn.dataset.playerid;
          if (!confirm(`確定要刪除玩家 ${playerId} 的成績嗎？此操作不可復原！`)) return;

          try {
            const res = await apiFetch(`/admin/leaderboard/${encodeURIComponent(studentId)}`, {
              method: 'DELETE'
            });
            const result = await res.json().catch(() => ({}));
            if (!res.ok) throw new Error(result.error || '刪除失敗');
            setMessage(`✅ 已刪除玩家 ${playerId} 的成績`);
            await reloadAndRender();
          } catch (err) {
            alert(`❌ ${err.message || '網路或伺服器錯誤，無法刪除'}`);
          }
        });
      });
    }

    async function loadAll() {
      const res = await apiFetch('/admin/leaderboard');
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || '載入排行榜失敗');
      return Array.isArray(data) ? data : [];
    }

    function renderCurrentFilter() {
      const cls = document.getElementById('class-input').value.trim();
      if (!cls) {
        renderTable(window.LBData);
        return;
      }
      renderTable(window.LBData.filter(item => String(item.playerId || '').startsWith(cls)));
    }

    async function reloadAndRender() {
      window.LBData = await loadAll();
      renderCurrentFilter();
    }

    async function enterAdmin() {
      try {
        const profile = await syncGoogleSession();
        if (profile.role !== 'teacher') {
          adminStatus.textContent = '此 Google 帳號沒有老師後台權限。';
          setMessage('❌ 無法進入後台，請使用白名單老師帳號。', true);
          return;
        }
        adminStatus.textContent = `已登入老師後台：${profile.displayName || '老師帳號'}`;
        setMessage('');
        await reloadAndRender();
      } catch (err) {
        adminStatus.textContent = err.message || '老師登入驗證失敗';
        setMessage('❌ 老師登入驗證失敗', true);
      }
    }

    adminGoogleBtn.addEventListener('click', async () => {
      adminGoogleBtn.disabled = true;
      adminGoogleBtn.textContent = '登入中...';
      try {
        const profile = await signInWithGoogle();
        if (profile.role !== 'teacher') {
          adminStatus.textContent = '此 Google 帳號沒有老師後台權限。';
          setMessage('❌ 無法進入後台，請使用白名單老師帳號。', true);
          return;
        }
        await enterAdmin();
      } catch (err) {
        adminStatus.textContent = err.message || '老師登入失敗';
      } finally {
        adminGoogleBtn.disabled = false;
        adminGoogleBtn.textContent = '老師 Google 登入';
      }
    });

    onFirebaseUserChanged((user) => {
      if (user) enterAdmin();
    });

    document.getElementById('back-btn').addEventListener('click', () => {
      const params = new URLSearchParams(window.location.search);
      if (params.get('from') === 'teacher-login') {
        window.location.href = './index.html?teacher=1';
        return;
      }

      if (window.opener && !window.opener.closed) {
        window.opener.focus();
        window.close();
        return;
      }

      if (document.referrer && new URL(document.referrer).origin === window.location.origin) {
        history.back();
        return;
      }

      window.location.href = './index.html';
    });

    document.getElementById('search-btn').addEventListener('click', renderCurrentFilter);

    document.getElementById('clear-btn').addEventListener('click', async () => {
      if (!confirm('確定要清除所有排行榜成績嗎？此操作不可復原！')) return;
      try {
        const res = await apiFetch('/leaderboard', { method: 'DELETE' });
        const result = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(result.error || '清除失敗');
        window.LBData = [];
        renderTable([]);
        setMessage('✅ 已成功清除所有成績');
      } catch (err) {
        alert(`❌ ${err.message || '網路或伺服器錯誤，無法清除'}`);
      }
    });
  </script>
</body>
</html>
